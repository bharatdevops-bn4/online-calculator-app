trigger:
- main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  dotnetVersion: '8.0.x'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'

steps:
# 1️⃣ Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '$(dotnetVersion)'

# 2️⃣ Restore
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'

# 3️⃣ Build
- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    arguments: '--configuration $(buildConfiguration)'

# 4️⃣ Publish
- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(publishDir)'
    zipAfterPublish: true

# 5️⃣ Deploy to Azure Web App (Linux)
- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: 'Towards-AzurePortal'
    appType: 'webApp'
    appName: 'web-calculator-app'
    package: '$(publishDir)/**/*.zip'
